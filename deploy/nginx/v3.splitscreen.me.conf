# nginx vhost of the beta: /etc/nginx/sites-available/v3.splitscreen.me, linked from sites-enabled.
# docs/ARCHITECTURE.md section 9.5; the procedure is in docs/DEPLOY.md.
# First install only the port 80 server, get the certificate, then the full file:
#   mkdir -p /var/www/letsencrypt && nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/letsencrypt -d v3.splitscreen.me --non-interactive \
#     --deploy-hook "systemctl reload nginx"
# Back up /etc/nginx/sites-available and sites-enabled into /root/nginx-backups/<date>/ first.

# Per-IP request rates, in front of the app's own buckets (section 6.5): every page, route handler and image
# costs CPU or queries on a small shared box, and the app limits only /api/v3 and the forms itself.
# Zone names are prefixed: limit_req_zone and map live in the http context, shared with the other vhosts.
limit_req_zone $binary_remote_addr zone=ssmv3_pages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ssmv3_og:10m rate=1r/s;
# Only requests with a non-empty "q" (catalogue search, uncached) count in the search zone.
map $arg_q $ssmv3_search_key {
    ""      "";
    default $binary_remote_addr;
}
limit_req_zone $ssmv3_search_key zone=ssmv3_search:10m rate=2r/s;
# Concurrent downloads of the app builds per IP (/releases/, about 45 MB each).
limit_conn_zone $binary_remote_addr zone=ssmv3_files:1m;

server {
    listen 80;
    server_name v3.splitscreen.me;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name v3.splitscreen.me;

    ssl_certificate     /etc/letsencrypt/live/v3.splitscreen.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v3.splitscreen.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS from nginx, so it also covers responses the app never sees (429, X-Accel-Redirect files).
    # No includeSubDomains: the other subdomains are not this vhost's to decide.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 1m;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    limit_req_status 429;
    limit_req_log_level warn;

    # Version uploads only (30 MiB packages).
    location ^~ /api/me/ {
        limit_req zone=ssmv3_pages burst=40 nodelay;
        client_max_body_size 32m;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:3010;
    }

    # Package files, served after the app has checked and counted (X-Accel-Redirect).
    location ^~ /_storage/packages/ {
        internal;
        alias /srv/ssm-v3/storage/packages/;
        # A location with its own add_header inherits none from the server block.
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Nucleus Co-op builds offered on /download (src/content/release.ts): static files from /srv/ssm-v3/releases,
    # served by nginx alone. The name carries the version, so a published file never changes. No listing: a
    # directory or a missing file is a plain 404.
    location ^~ /releases/ {
        root /srv/ssm-v3;
        try_files $uri =404;
        limit_req zone=ssmv3_pages burst=80 nodelay;
        limit_conn ssmv3_files 4;
        limit_conn_status 429;
        types { application/zip zip; }
        default_type application/octet-stream;
        expires 1d;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Hashed build assets: cheap, and a page load fetches many at once.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
    }

    # Open Graph images: a render costs 100-500 ms of CPU (the app caches them per game).
    location ~ /opengraph-image {
        limit_req zone=ssmv3_og burst=20 nodelay;
        limit_req zone=ssmv3_pages burst=80 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }

    location / {
        limit_req zone=ssmv3_pages burst=80 nodelay;
        limit_req zone=ssmv3_search burst=20 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3010;
    }

    access_log /var/log/nginx/v3.splitscreen.me.access.log;
    error_log  /var/log/nginx/v3.splitscreen.me.error.log;
}
